name: Build iOS IPA Unsigned

on:
  workflow_dispatch:
  push:
    branches: [ main, master, flutterflow ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (Versión fija compatible con FlutterFlow)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          cache: true

      - name: Update Minimum iOS Deployment Target
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' 's/# platform :ios/platform :ios/' ios/Podfile
            sed -i '' "s/platform :ios, '.*'/platform :ios, '13.0'/" ios/Podfile
            sed -i '' 's/platform :ios, ".*"/platform :ios, "13.0"/' ios/Podfile
          fi

      - name: Configure Xcode Signing Settings
        run: |
          # Inyectar ID de equipo ficticio para la validación de Flutter CLI
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER =/DEVELOPMENT_TEAM = "1234567890";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER =/g' ios/Runner.xcodeproj/project.pbxproj
          
          # Desactivar firma de código directamente en la configuración de iOS
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig

      - name: Resolve and Get Dependencies
        run: |
          rm -f pubspec.lock
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  collection: 1.18.0" >> pubspec.yaml
          flutter pub get

      - name: Build iOS (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package App into .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-runner
          path: Runner.ipa
